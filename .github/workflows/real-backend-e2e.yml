name: Real backend browser checks

on:
  pull_request:
    branches: [master, docs/wo07-endpoint-decisions]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          range="$BASE..$HEAD"
          if [[ "$EVENT" == pull_request ]]; then range="$BASE...$HEAD"; fi
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$BASE^{commit}"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$range" -- frontend/ web/ paper/ db/ ai/ backtest/ notifications/ deploy/ .github/workflows/ .github/actions/ > "$RUNNER_TEMP/real-e2e-changes"
          if [[ -s "$RUNNER_TEMP/real-e2e-changes" ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  real-backend-e2e:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_ROOT_HOST: localhost
          MARIADB_DATABASE: signal_bot_test
        ports:
          - "127.0.0.1:3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: signal_bot_ci
      MYSQL_DATABASE: signal_bot_test
      SIGNAL_BOT_REAL_E2E_URL: http://127.0.0.1:8050
      SIGNAL_BOT_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify the change detector
        env:
          RESULT: ${{ needs.changes.result }}
        run: test "$RESULT" = success

      - name: Explain why the browser suite is unnecessary
        if: needs.changes.outputs.relevant == 'false'
        run: echo 'No browser or server paths changed.'

      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.relevant == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: python -m pip install -r requirements.txt
      - name: Provision and migrate isolated database
        if: needs.changes.outputs.relevant == 'true'
        uses: ./.github/actions/provision-mariadb
        with:
          container-id: ${{ job.services.mariadb.id }}

      - name: Seed browser fixtures
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -eu
          browser_password=$(openssl rand -hex 24)
          echo "::add-mask::$browser_password"
          printf 'SIGNAL_BOT_REAL_E2E_PASSWORD=%s\n' "$browser_password" >> "$GITHUB_ENV"
          SIGNAL_BOT_REAL_E2E_PASSWORD="$browser_password" PYTHONPATH=. python frontend/e2e/seed_real_backend.py

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.relevant == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Modern UI
        if: needs.changes.outputs.relevant == 'true'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Start API and wait for readiness
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/real-e2e"
          unset TELEGRAM_DELIVERY_ENABLED RETAILBOT2_PRODUCTION_ENQUEUE_ENABLED RETAILBOT2_ALLOW_TELEGRAM_DELIVERY
          SIGNAL_BOT_USE_MODERN_UI=0 PYTHONPATH=. python -m uvicorn frontend.e2e.fixture_app:app --host 127.0.0.1 --port 8050 > "$RUNNER_TEMP/real-e2e/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/real-e2e/api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent "$SIGNAL_BOT_REAL_E2E_URL/readyz" >/dev/null; then exit 0; fi
            sleep 1
          done
          python frontend/e2e/redact_logs.py "$RUNNER_TEMP/real-e2e/api.log"
          tail -n 50 "$RUNNER_TEMP/real-e2e/api.log"
          exit 1

      - name: Install Chromium for the locked Playwright version
        if: needs.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend browser suite
        if: needs.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: |
          set +e
          npx playwright test --project real-backend --reporter=list > "$RUNNER_TEMP/real-e2e/playwright.log" 2>&1
          result=$?
          python e2e/redact_logs.py "$RUNNER_TEMP/real-e2e/playwright.log" || exit 1
          cat "$RUNNER_TEMP/real-e2e/playwright.log"
          exit "$result"

      - name: Redact and check diagnostic logs for fixture credentials
        id: redact
        if: always() && needs.changes.outputs.relevant == 'true'
        run: |
          set -eu
          if [[ -f "$RUNNER_TEMP/real-e2e/api.pid" ]]; then
            api_pid=$(cat "$RUNNER_TEMP/real-e2e/api.pid")
            kill "$api_pid" 2>/dev/null || true
            for attempt in {1..20}; do
              if ! kill -0 "$api_pid" 2>/dev/null || [[ "$(ps -o stat= -p "$api_pid")" == Z* ]]; then break; fi
              sleep 0.25
            done
            if kill -0 "$api_pid" 2>/dev/null && [[ "$(ps -o stat= -p "$api_pid")" != Z* ]]; then exit 1; fi
          fi
          python frontend/e2e/redact_logs.py "$RUNNER_TEMP/real-e2e/api.log" "$RUNNER_TEMP/real-e2e/playwright.log"

      - name: Upload redacted diagnostics on failure
        if: failure() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: real-backend-e2e-logs
          path: |
            ${{ runner.temp }}/real-e2e/api.log
            ${{ runner.temp }}/real-e2e/playwright.log
          if-no-files-found: ignore
