name: Frontend browser smoke tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
