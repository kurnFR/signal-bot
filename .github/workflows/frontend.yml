name: Frontend foundation

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install pinned frontend dependencies (lockfile bootstrap phase)
        run: npm install --no-audit --no-fund
      # Temporary bridge until the generated lockfile is committed and CI uses npm ci.
      - name: Bootstrap lockfile artifact for reproducible install migration
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-bootstrap
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 2
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
