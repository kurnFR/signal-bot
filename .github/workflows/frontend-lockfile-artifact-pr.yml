name: Frontend lockfile artifact PR

on:
  workflow_run:
    workflows: ["Frontend foundation"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  open-lockfile-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Download generated lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/frontend-lockfile
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name frontend-lockfile-bootstrap --dir /tmp/frontend-lockfile
          test -s /tmp/frontend-lockfile/package-lock.json
          node -e "const p=require('./frontend/package.json'); const l=require('/tmp/frontend-lockfile/package-lock.json'); if(l.name !== p.name || l.packages?.['']?.name !== p.name) process.exit(1); console.log('Lockfile package identity verified:', p.name)"
      - name: Create lockfile pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/frontend-lockfile/package-lock.json frontend/package-lock.json
          git checkout -B chore/frontend-lockfile-generated
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated lockfile already matches the branch; no commit needed."
            exit 0
          fi
          git commit -m "build(frontend): commit generated npm lockfile"
          git push --force-with-lease origin chore/frontend-lockfile-generated
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base master --head chore/frontend-lockfile-generated \
            --title "build(frontend): commit generated npm lockfile" \
            --body "Generated by the successful Frontend foundation run $RUN_ID. This PR commits the registry-resolved npm lockfile so CI can switch to npm ci. No runtime or deployment changes.";
