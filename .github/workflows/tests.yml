name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener tests
        env:
          SCREENER_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m pytest -q tests/test_screener.py tests/test_smart_money_ema_warmup.py tests/test_wallet_tracker.py

  wallet-tracker-mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: wallet_tracker_test_root
          MARIADB_DATABASE: wallet_tracker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: wallet_tracker_test_root
      MYSQL_DATABASE: wallet_tracker_test
      WALLET_TRACKER_MARIADB_TESTS: '1'
      PAPER_ORDERS_MARIADB_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python==9.1.0 python-dotenv==1.0.1 pytest==8.3.5

      - name: Run MariaDB concurrency and paper-order recovery tests
        run: python -m pytest -q tests/test_wallet_tracker_mariadb.py tests/test_paper_orders_mariadb.py
