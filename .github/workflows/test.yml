# Full suite on disposable signal_bot_test, including restricted-account integration tests.
name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, feature/market-screener-v2, feat/modern-ui-parity-followups]

jobs:
  mariadb-integration:
    # The full suite exceeded the previous 15-minute job limit without
    # producing a failure report. Allow enough time to finish and emit
    # per-test timing so slow or blocked tests can be identified.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_ROOT_HOST: localhost
          MARIADB_DATABASE: signal_bot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: signal_bot_ci
      MYSQL_DATABASE: signal_bot_test
      SIGNAL_BOT_RUN_RETAILBOT2_DB_INTEGRATION: "1"
      SIGNAL_BOT_TEST_DB_HOST: 127.0.0.1
      SIGNAL_BOT_TEST_DB_PORT: 3306
      WALLET_TRACKER_MARIADB_TESTS: "1"
      PAPER_ORDERS_MARIADB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Provision isolated database
        uses: ./.github/actions/provision-mariadb
        with:
          container-id: ${{ job.services.mariadb.id }}
          test-user: ${{ secrets.SIGNAL_BOT_TEST_DB_USER }}
          test-password: ${{ secrets.SIGNAL_BOT_TEST_DB_PASSWORD }}

      - name: Verify deployment manifest
        run: python deploy/verify_deployment_package.py --json --check-manifest

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests --durations=25 --timeout=120
