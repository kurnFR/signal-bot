name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, feature/market-screener-v2]

jobs:
  pytest:
    # The full suite exceeded the previous 15-minute job limit without
    # producing a failure report. Allow enough time to finish and emit
    # per-test timing so slow or blocked tests can be identified.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: signal_bot_test_root
          MARIADB_DATABASE: signal_bot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: signal_bot_test_root
      MYSQL_DATABASE: signal_bot_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout==2.3.1

      - name: Apply migrations to isolated test database
        run: python -m db.migrate

      - name: Seed isolated test admin identity
        run: |
          python - <<'PY'
          import secrets
          from db.db import get_pool
          from web.auth import hash_password

          conn = get_pool().get_connection()
          try:
              cur = conn.cursor()
              cur.execute(
                  """
                  INSERT INTO users
                      (id, username, email, password_hash, role, is_active, must_change_password)
                  VALUES
                      (1, 'admin', 'admin@example.test', %s, 'admin', 1, 0)
                  ON DUPLICATE KEY UPDATE
                      username = VALUES(username),
                      role = VALUES(role),
                      is_active = VALUES(is_active),
                      must_change_password = VALUES(must_change_password)
                  """,
                  (hash_password(secrets.token_urlsafe(32)),),
              )
              conn.commit()
              cur.close()
          finally:
              conn.close()
          PY

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -vv --durations=25 --timeout=120
