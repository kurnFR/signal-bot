name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, feature/market-screener-v2]

jobs:
  pytest:
    # The full suite exceeded the previous 15-minute job limit without
    # producing a failure report. Allow enough time to finish and emit
    # per-test timing so slow or blocked tests can be identified.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout==2.3.1

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -vv --durations=25 --timeout=120
