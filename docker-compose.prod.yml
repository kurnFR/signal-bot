# Production TLS overlay (automatic HTTPS via Caddy + hides raw port 8050 from public internet)
# Usage:
#   SIGNAL_BOT_DOMAIN=desk.yourdomain.com \
#   SIGNAL_BOT_ALLOWED_ORIGINS=https://desk.yourdomain.com \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    ports: !reset
      - "127.0.0.1:8050:8050"

  caddy:
    image: caddy:2-alpine
    container_name: signal-bot-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SIGNAL_BOT_DOMAIN: ${SIGNAL_BOT_DOMAIN:?SIGNAL_BOT_DOMAIN must be set (e.g. desk.yourdomain.com)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
